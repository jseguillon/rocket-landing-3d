<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Landing 3D</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="ui">
        <div id="mission-bar">
          <div class="mission-title">Starship Landing Demo</div>
          <div class="phase-badge" id="phase-badge">orbital</div>
        </div>
        <div id="telemetry" role="region" aria-label="Telemetry">
          <div class="row"><span class="label">Altitude</span><span id="telemetry-alt">0</span> m</div>
          <div class="row"><span class="label">VSpeed</span><span id="telemetry-vs">0</span> m/s</div>
          <div class="row"><span class="label">Fuel</span><span id="telemetry-fuel">100</span>%</div>
          <div class="row"><span class="label">Phase</span><span id="telemetry-phase">idle</span></div>
        </div>
        <div id="controls">
          <button id="play-pause" aria-label="Pause">⏸</button>
          <button id="restart" aria-label="Restart">↺</button>
          <button id="prev-phase" aria-label="Previous phase">◀</button>
          <button id="next-phase" aria-label="Next phase">▶</button>
          <input id="scrubber" type="range" min="0" max="100" value="0" aria-label="Timeline scrubber" />
          <select id="camera-mode" aria-label="Camera mode">
            <option value="chase">Chase</option>
            <option value="orbit">Orbit</option>
            <option value="pad">Pad</option>
            <option value="cinematic">Cinematic</option>
          </select>
          <select id="quality" aria-label="Quality">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
